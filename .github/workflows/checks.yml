name: App checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
        env:
          TZ: America/New_York
      - run: npm run build
        env:
          REACT_APP_SUPABASE_URL: https://example.supabase.co
          REACT_APP_SUPABASE_KEY: build-placeholder
